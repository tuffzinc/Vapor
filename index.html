<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapor</title>
    
    <link rel="stylesheet" href="assets/css/root.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .app-header {
            height: var(--header-height);
            background-color: var(--bg-nav);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ffffff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 20px 16px;
            font-size: 0.95rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-btn:hover {
            color: #ffffff;
        }

        .nav-btn.active {
            color: var(--accent-blue);
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 12px;
            right: 12px;
            height: 3px;
            background-color: var(--accent-blue);
            box-shadow: 0 0 12px var(--accent-blue);
            border-radius: 3px;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .username {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .username:hover {
            color: #ffffff;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2e3440, #4c566a);
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background-color: var(--avatar-online);
            border: 2px solid var(--bg-nav);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--avatar-online);
        }

        .app-view {
            flex: 1;
            background-color: #090a0f;
            display: flex;
            position: relative;
        }

        #game-viewport {
            width: 100%;
            height: 100%;
            border: none;
            animation: viewportFade 0.4s ease-out;
        }

        .app-footer {
            height: var(--footer-height);
            background-color: #0b0c10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            letter-spacing: 0.5px;
        }

        @keyframes slideIn {
            from { transform: scaleX(0); opacity: 0; }
            to { transform: scaleX(1); opacity: 1; }
        }

        @keyframes viewportFade {
            from { opacity: 0; transform: scale(0.995); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <div class="logo">Vapor</div>
            <nav class="nav-links">
                <button class="nav-btn active" onclick="switchTab('home', event)">Home</button>
                <button class="nav-btn" onclick="switchTab('shop', event)">Shop</button>
                <button class="nav-btn" onclick="switchTab('library', event)">Library</button>
                <button class="nav-btn" onclick="switchTab('community', event)">Community</button>
            </nav>
        </div>

    </header>

    <main class="app-view">
        <iframe 
            id="game-viewport" 
            src="dashboard.html" 
            allow="autoplay; keyboard; pointer-lock" 
            frameborder="0">
        </iframe>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Vapor</p>
    </footer>

    <script>
        const pageLibrary = {
            home: "home.html", 
            shop: "shop.html", 
            library: "library.html", 
            community: "community.html"
        };

        function switchTab(pageKey, e) {
            const iframe = document.getElementById('game-viewport');
            
            if (pageLibrary[pageKey]) {
                const newIframe = iframe.cloneNode(true);
                newIframe.src = pageLibrary[pageKey];
                iframe.parentNode.replaceChild(newIframe, iframe);
            }

            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            e.target.classList.add('active');
        }
    </script>
</body>
</html>
